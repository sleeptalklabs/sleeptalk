<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>Sleeptalk private setup</title>
<link rel="stylesheet" href="/entry/style.css">
<script type="module" src="/entry/app.js"></script>
</head>
<body>
<main aria-busy="true">
<p class="eyebrow">SLEEPTALK · PRIVATE SETUP</p>
<h1>Your voice, on your host.</h1>
<p class="destination"><span id="host">Verifying host</span><span id="workspace"></span></p>
<p id="status" role="status" aria-live="polite">Checking the invitation and browser security…</p>
<div id="content"></div>
<button id="close" class="quiet" type="button">Close and clear this page</button>
<p class="note">Only pair from the trusted setup page on your host. Keep provider credentials in this page, never in chat.</p>
</main>
</body>
</html>
