<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sleeptalk settings</title><link rel="stylesheet" href="/settings.css"><script defer src="/settings.js"></script></head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">Sleeptalk</div>
    <label class="side-profile"><span id="profile-label">Profile</span> <span class="select"><select id="profile"></select></span></label>
    <div id="profile-actions" class="side-actions"></div>
    <nav id="nav" class="nav" aria-label="Settings sections"></nav>
    <p class="side-foot" id="side-foot">Runs on this computer. Keys are checked with their provider and kept in a private store here. Sleeptalk has no server and no account.</p>
  </aside>
  <main class="main" id="main">
    <div class="topbar" id="langpick"></div>
    <div id="page"><p class="loading">Opening settings…</p></div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
