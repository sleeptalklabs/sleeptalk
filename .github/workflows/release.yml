name: Release

# Build and prove the package on every version tag, then publish to PyPI
# through trusted publishing. Configure the `pypi` environment with required
# reviewers before enabling this for a real release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Release only a tag that matches the version and is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "Tagged commit is not on main" >&2; exit 1; }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # A release build never restores a cache another run wrote.
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install audio libraries and start PulseAudio for the headless runner
        run: |
          sudo apt-get update && sudo apt-get install -y libportaudio2 libopus0 pulseaudio
          # The release proof imports sounddevice without opening an audio stream.
          pulseaudio --start --exit-idle-time=-1
          pulseaudio --check

      - name: Test package and release tools
        run: |
          uv sync --locked --dev --extra remote-entry --extra claude --extra discord --extra terminal
          uv run pytest -q
          uv run pytest scripts/test_audit_release_contents.py -q

      - name: Test Rendezvous
        working-directory: rendezvous
        run: |
          npm ci
          npm test
          npm run build

      - name: Package sources are exactly the tagged commit
        # The npm steps above run third-party install scripts; nothing they
        # did may reach the wheel.
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- sleeptalk pyproject.toml)"

      - name: Prove release artifacts
        run: bash scripts/prove_release_wheel.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Only distributions: the publish step uploads every file it is given.
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sleeptalk-install
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/constraints.txt
            dist/install.sh
            dist/SHA256SUMS
            dist/BUILD_RECORD.json
            dist/ROLLBACK.json
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sleeptalk-install
          path: dist
      - name: Publish the verified install bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Sleeptalk $GITHUB_REF_NAME" --generate-notes
