name: Harness release audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check official releases without installing harnesses
        run: python -m sleeptalk.harness_versions --upstream --fail-on-change --json > harness-releases.json
      - name: Retain the release review report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-releases
          path: harness-releases.json
          if-no-files-found: error
      - name: Explain the review gate
        if: failure()
        run: echo 'Review the harness-releases artifact. A changed release needs compatibility review; unavailable metadata needs a retry. No runtime was upgraded.' >> "$GITHUB_STEP_SUMMARY"
